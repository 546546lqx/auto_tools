<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YOLO 数据工具箱{% endblock %}</title>
  <style>
    :root{--bg:#f6f8fb;--text:#1f2937;--card:#fff;--muted:#6b7280;--border:#dbe3ee;--primary:#2563eb;--warning:#f59e0b;--success:#16a34a;}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;}
    a{color:inherit;text-decoration:none}
    .container{width:min(1180px,calc(100% - 32px));margin:0 auto}
    .navbar{background:#111827;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.12)}
    .navbar .container{display:flex;align-items:center;gap:16px;padding:14px 0;flex-wrap:wrap}
    .navbar-brand{font-weight:800;letter-spacing:.2px}
    .nav-links{display:flex;flex-wrap:wrap;gap:14px;margin-left:auto}
    .nav-link{opacity:.88}.nav-link:hover{opacity:1;text-decoration:underline}
    main.container{padding:24px 0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .p-3{padding:16px}.p-4{padding:24px}.mb-3{margin-bottom:16px}.mb-4{margin-bottom:24px}.mt-auto{margin-top:auto}
    .shadow-sm{box-shadow:0 10px 30px rgba(15,23,42,.06)}
    .row{display:flex;flex-wrap:wrap;margin:-12px}.g-3>.col-md-4,.g-4>.col-md-6,.g-4>.col-lg-4,.g-4>.col-lg-8{padding:12px}
    .col-md-4{width:33.3333%}.col-md-6{width:50%}.col-lg-4{width:33.3333%}.col-lg-8{width:66.6667%}
    @media (max-width: 900px){.col-md-4,.col-md-6,.col-lg-4,.col-lg-8{width:100%}.nav-links{margin-left:0}.navbar .container{align-items:flex-start}}
    .btn{display:inline-block;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
    .btn-primary{background:var(--primary);color:#fff}.btn-success{background:var(--success);color:#fff}.btn-warning{background:var(--warning);color:#111827}.btn-secondary{background:#64748b;color:#fff}
    .form-control,.form-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text)}
    .form-label{display:block;margin-bottom:8px;font-weight:600}.form-text{font-size:.86rem;color:var(--muted);margin-top:6px}
    .alert{padding:14px 16px;border-radius:14px;margin-bottom:16px}.alert-success{background:#ecfdf5;color:#166534;border:1px solid #bbf7d0}.alert-danger{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.alert-info{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
    .text-muted{color:var(--muted)} pre{white-space:pre-wrap;word-break:break-word;margin:0}
    footer{border-top:1px solid var(--border);padding:16px 0;text-align:center;color:var(--muted);font-size:.9rem;margin-top:24px}
    .feature-card{transition:transform .18s ease, box-shadow .18s ease}.feature-card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(15,23,42,.1)}
    .d-flex{display:flex}.flex-column{flex-direction:column}.gap-2{gap:8px}.gap-3{gap:12px}.g-4>.col-md-6,.g-4>.col-lg-4,.g-4>.col-lg-8{padding:12px}
    .row.g-4,.row.g-3{display:flex;flex-wrap:wrap}
    .form-check{display:flex;align-items:center;gap:8px}.form-check-input{width:16px;height:16px}
    .w-100{width:100%}.small{font-size:.86rem}
    .poly-canvas{display:block;width:100%;min-height:520px;max-height:760px;border:1px solid #dbe3ee;border-radius:16px;background:#fff;cursor:crosshair}
    .poly-stage{width:100%;overflow:auto;border-radius:16px}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home.index') }}">YOLO 数据工具箱</a>
    <div class="nav-links">
      <a class="nav-link" href="{{ url_for('home.index') }}">首页</a>
      <a class="nav-link" href="{{ url_for('stats.stats_page') }}">统计</a>
      <a class="nav-link" href="{{ url_for('stats.cleanup_page') }}">清理</a>
      <a class="nav-link" href="{{ url_for('split.split_page') }}">划分</a>
      <a class="nav-link" href="{{ url_for('split.rename_page') }}">重命名</a>
      <a class="nav-link" href="{{ url_for('convert.convert_page') }}">格式转换</a>
      <a class="nav-link" href="{{ url_for('video.video_page') }}">视频与RTSP</a>
      <a class="nav-link" href="{{ url_for('polygon.polygon_page') }}">多边形标注</a>
    </div>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<footer>本地 YOLO 数据处理工具</footer>
</body>
</html>
