<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YOLO 数据工具箱{% endblock %}</title>
  <style>
    :root{
      --bg0:#eef4ff;
      --bg1:#f8fbff;
      --surface:rgba(255,255,255,.86);
      --surface-strong:#ffffff;
      --surface-soft:rgba(248,250,252,.92);
      --text:#0f172a;
      --muted:#64748b;
      --border:#dbe5f0;
      --primary:#2563eb;
      --primary-2:#4f46e5;
      --success:#16a34a;
      --warning:#d97706;
      --danger:#dc2626;
      --shadow:0 18px 50px rgba(15,23,42,.10);
      --shadow-soft:0 10px 28px rgba(15,23,42,.08);
      --radius:22px;
      --radius-sm:14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79,70,229,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(37,99,235,.14), transparent 32%),
        linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 100%);
      overflow-x:hidden;
    }
    a{color:inherit;text-decoration:none}
    button,input,select,textarea{font:inherit}
    .container{width:min(1280px,calc(100% - 28px));margin:0 auto}
    .navbar{
      position:sticky;top:0;z-index:20;
      backdrop-filter:blur(16px);
      background:rgba(15,23,42,.84);
      color:#fff;
      border-bottom:1px solid rgba(255,255,255,.08);
      box-shadow:0 10px 30px rgba(2,6,23,.14);
    }
    .navbar .container{display:flex;align-items:center;gap:18px;padding:14px 0;flex-wrap:wrap}
    .navbar-brand{font-weight:800;letter-spacing:.3px;font-size:1.05rem}
    .nav-links{display:flex;flex-wrap:wrap;gap:10px;margin-left:auto}
    .nav-link{
      padding:8px 12px;border-radius:999px;
      color:rgba(255,255,255,.9);
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      transition:transform .18s ease, background .18s ease, color .18s ease;
    }
    .nav-link:hover{transform:translateY(-1px);background:rgba(255,255,255,.14);color:#fff}
    main.container{
      padding:18px 0 16px;
      min-height:calc(100vh - 70px - 60px);
    }
    footer{
      padding:10px 0 14px;
      text-align:center;
      color:rgba(71,85,105,.88);
      font-size:.88rem;
    }
    .card{
      background:var(--surface);
      border:1px solid rgba(255,255,255,.9);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
    }
    .card-soft{background:var(--surface-soft)}
    .card-body{padding:20px}
    .p-3{padding:14px}.p-4{padding:20px}
    .mb-0{margin-bottom:0}.mb-2{margin-bottom:10px}.mb-3{margin-bottom:14px}.mb-4{margin-bottom:18px}
    .mt-auto{margin-top:auto}
    .shadow-sm{box-shadow:var(--shadow-soft)}
    .row{display:flex;flex-wrap:wrap;margin:-10px}
    .g-3>.col-md-4,.g-4>.col-md-6,.g-4>.col-lg-4,.g-4>.col-lg-8,.g-3>.col-md-6,.g-3>.col-md-12{padding:10px}
    .col-md-4{width:33.3333%}.col-md-6{width:50%}.col-md-12{width:100%}.col-lg-4{width:33.3333%}.col-lg-8{width:66.6667%}
    @media (max-width: 1100px){.col-lg-4,.col-lg-8{width:100%}}
    @media (max-width: 900px){.col-md-4,.col-md-6,.col-md-12{width:100%}.nav-links{margin-left:0}.navbar .container{align-items:flex-start}}
    .btn{
      display:inline-flex;align-items:center;justify-content:center;gap:8px;
      border:0;border-radius:14px;padding:10px 16px;cursor:pointer;font-weight:700;
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
      box-shadow:0 8px 18px rgba(15,23,42,.12)
    }
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
    .btn-success{background:linear-gradient(135deg,#16a34a,#0f766e);color:#fff}
    .btn-warning{background:linear-gradient(135deg,#f59e0b,#d97706);color:#111827}
    .btn-secondary{background:linear-gradient(135deg,#64748b,#475569);color:#fff}
    .form-control,.form-select,textarea.form-control{
      width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:14px;
      background:rgba(255,255,255,.96);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)
    }
    textarea.form-control{resize:none}
    .form-label{display:block;margin-bottom:8px;font-weight:700}.form-text{font-size:.84rem;color:var(--muted);margin-top:6px}
    .alert{padding:12px 14px;border-radius:16px;margin-bottom:14px;border:1px solid transparent}
    .alert-success{background:#ecfdf5;color:#166534;border-color:#bbf7d0}.alert-danger{background:#fef2f2;color:#991b1b;border-color:#fecaca}.alert-info{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
    .text-muted{color:var(--muted)}
    .small{font-size:.86rem}
    pre{white-space:pre-wrap;word-break:break-word;margin:0;font-size:.9rem;line-height:1.45}
    .feature-card{transition:transform .18s ease, box-shadow .18s ease}
    .feature-card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(15,23,42,.14)}
    .d-flex{display:flex}.flex-column{flex-direction:column}.align-items-center{align-items:center}.justify-content-between{justify-content:space-between}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.flex-wrap{flex-wrap:wrap}
    .form-check{display:flex;align-items:center;gap:8px}.form-check-input{width:16px;height:16px}
    .w-100{width:100%}.h-100{height:100%}.fw-bold{font-weight:700}
    .tool-shell{
      display:grid;
      grid-template-columns:minmax(320px, 0.92fr) minmax(0, 1.08fr);
      gap:16px;
      align-items:stretch;
      height:calc(100vh - 70px - 60px - 34px);
      max-height:calc(100vh - 70px - 60px - 34px);
      overflow:hidden;
    }
    .tool-shell.single{
      grid-template-columns:1fr;
      height:auto;
      max-height:none;
      overflow:visible;
    }
    .tool-pane{
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .tool-pane.scrollable{
      overflow:hidden;
    }
    .tool-pane .card{
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .tool-pane .card-body{min-height:0;display:flex;flex-direction:column;gap:14px;overflow:hidden}
    .tool-page-title{margin:0;font-size:1.35rem;line-height:1.2}
    .tool-subtitle{margin:0;color:var(--muted);font-size:.92rem}
    .tool-compact{gap:12px}
    .tool-compact .mb-3{margin-bottom:12px}.tool-compact .mb-4{margin-bottom:14px}
    .tool-compact .form-control,.tool-compact .form-select,.tool-compact textarea.form-control{padding:10px 12px;border-radius:12px}
    .tool-scroll{
      min-height:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .tool-scroll .card-body{
      min-height:0;
      overflow:auto;
      padding-right:10px;
      scrollbar-gutter:stable;
    }
    .tool-scroll .card-body::-webkit-scrollbar{width:8px}
    .tool-scroll .card-body::-webkit-scrollbar-thumb{background:rgba(100,116,139,.35);border-radius:999px}
    .result-panel{display:flex;flex-direction:column;gap:12px;min-height:0}
    .result-panel .card-body{overflow:auto;min-height:0}
    .hero-card{background:linear-gradient(135deg, rgba(37,99,235,.96), rgba(79,70,229,.96));color:#fff;border:none;box-shadow:0 18px 42px rgba(37,99,235,.24)}
    .hero-card .text-muted{color:rgba(255,255,255,.82)}
    .hero-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:12px;margin-top:14px}
    .hero-stat{padding:14px;border-radius:16px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
    .hero-stat strong{display:block;font-size:1rem;margin-bottom:4px}
    .poly-canvas{display:block;width:100%;height:100%;min-height:0;border:1px solid #dbe3ee;border-radius:18px;background:#fff;cursor:crosshair}
    .poly-stage{width:100%;height:min(58vh, 620px);overflow:hidden;border-radius:18px}
    .path-picker-row{display:flex;gap:10px;align-items:flex-end}
    .path-picker-row .grow{flex:1}
    .path-picker-btn{white-space:nowrap;min-width:110px}
    .path-preview{margin-top:8px;padding:10px 12px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;color:#475569;font-size:.88rem;word-break:break-all}
    .path-preview.empty{color:#94a3b8}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home.index') }}">YOLO 数据工具箱</a>
    <div class="nav-links">
      <a class="nav-link" href="{{ url_for('home.index') }}">首页</a>
      <a class="nav-link" href="{{ url_for('stats.stats_page') }}">统计</a>
      <a class="nav-link" href="{{ url_for('stats.cleanup_page') }}">清理</a>
      <a class="nav-link" href="{{ url_for('split.split_page') }}">划分</a>
      <a class="nav-link" href="{{ url_for('split.rename_page') }}">重命名</a>
      <a class="nav-link" href="{{ url_for('convert.convert_page') }}">格式转换</a>
      <a class="nav-link" href="{{ url_for('video.video_page') }}">视频与RTSP</a>
      <a class="nav-link" href="{{ url_for('polygon.polygon_page') }}">多边形标注</a>
      <a class="nav-link" href="{{ url_for('auto_label.auto_label_page') }}">自动化标注</a>
    </div>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/path-picker.js') }}"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<footer>本地 YOLO 数据处理工具</footer>
</body>
</html>
